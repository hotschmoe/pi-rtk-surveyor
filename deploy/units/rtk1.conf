# RTK1: rover. LC29H(DA) HAT.
[unit]
role = rover
name = RTK1

[caster]
# "auto" listens for the base's beacon, so no address needs configuring.
# Or give the base's IPv4 address, and mount/user/password for a public caster.
host = auto
mount = BASE

[survey]
pole_height_m = 2.000
min_epochs = 15
codes = PT,COR,EP,FNC,BLD,TRE,UTL,PIN
