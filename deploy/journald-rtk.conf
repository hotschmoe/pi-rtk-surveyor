# Keep the journal across reboots and power loss (Raspberry Pi OS ships Storage=volatile to spare
# the SD card). rtkd logs about 2 MB a day, so the wear is negligible; the cap bounds disk use.
# Named 90-* so it sorts after (and overrides) the OS's volatile setting.
[Journal]
Storage=persistent
SystemMaxUse=30M
SyncIntervalSec=1min
