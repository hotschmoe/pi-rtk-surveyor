<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTK map viewer</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14181f;--dim:#5b6573;--line:#d9dde3;--accent:#1f5fbf;--minor:#b98a5a;--major:#8a4b12;--tin:#c4c8ce;--pt:#111}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e8ebf0;--dim:#97a1af;--line:#2a323d;--accent:#7fb0ff;--minor:#b98a5a;--major:#e0a468;--tin:#3a424d;--pt:#f2f2f2}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
label{display:inline-flex;align-items:center;gap:4px;color:var(--dim)}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;display:none;white-space:pre;box-shadow:0 2px 8px #0003}
#stats{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--dim);max-width:70%}
#msg{pointer-events:none;position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--dim);padding:20px}
#legend{position:absolute;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--dim)}
#bar{height:10px;width:140px;border-radius:3px;margin:2px 0}
</style>
</head>
<body>
<header>
  <h1 id="title">RTK map</h1>
  <button id="b2d" class="on">Plan</button><button id="b3d">3D</button>
  <label><input type="checkbox" id="cTint" checked> tint</label>
  <label><input type="checkbox" id="cCont" checked> contours</label>
  <label><input type="checkbox" id="cTin"> TIN</label>
  <label><input type="checkbox" id="cPts" checked> points</label>
  <label><input type="checkbox" id="cLab" checked> labels</label>
  <label>interval <select id="sInt"><option value="0">auto</option><option>0.1</option><option>0.25</option><option>0.5</option><option>1</option><option>2</option><option>5</option></select></label>
  <label id="exl" style="display:none">vertical x<input type="range" id="rEx" min="1" max="10" step="0.5" value="2"></label>
  <button id="bFit">Fit</button><button id="bPng">Save PNG</button>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="tip"></div><div id="msg"></div>
  <div id="stats"></div>
  <div id="legend"><div id="lmax"></div><div id="bar"></div><div id="lmin"></div></div>
</div>
<script>window.RTK_DATA = null;/*INLINE_DATA*/ window.RTK_WASM = null;/*INLINE_WASM*/</script>
<script>
// ==== geometry (testable; extracted by tools/test_viewer.js) ====
function llToLocal(features) {
  const f = features.filter(x => x.geometry && x.geometry.type === 'Point');
  if (!f.length) return { pts: [], lat0: 0, lon0: 0 };
  let lat0 = 0, lon0 = 0;
  for (const x of f) { lon0 += x.geometry.coordinates[0]; lat0 += x.geometry.coordinates[1]; }
  lat0 /= f.length; lon0 /= f.length;
  const p = lat0 * Math.PI / 180;
  const mLat = 111132.92 - 559.82 * Math.cos(2 * p) + 1.175 * Math.cos(4 * p);
  const mLon = 111412.84 * Math.cos(p) - 93.5 * Math.cos(3 * p);
  const pts = f.map(x => {
    const c = x.geometry.coordinates, pr = x.properties || {};
    return { x: (c[0] - lon0) * mLon, y: (c[1] - lat0) * mLat, z: c[2], id: String(pr.id || ''), code: pr.code || '',
             hacc: pr.h_acc, vacc: pr.v_acc, fix: pr.fix || '', time: pr.time || '' };
  });
  return { pts, lat0, lon0 };
}

function niceStep(x) {
  const e = Math.pow(10, Math.floor(Math.log10(x)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= x) return m * e;
  return 10 * e;
}

// Bowyer-Watson Delaunay triangulation of {x,y} points. Returns [[i,j,k], ...] (indices into P).
function delaunay(P) {
  const n = P.length;
  if (n < 3) return [];
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const p of P) { minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y); }
  const d = Math.max(maxx - minx, maxy - miny, 1), mx = (minx + maxx) / 2, my = (miny + maxy) / 2;
  const V = P.map(p => ({ x: p.x, y: p.y }));
  // A very large super-triangle: a small one swallows near-collinear hull triangles (huge circumcircles).
  const K = 1000;
  V.push({ x: mx - K * d, y: my - d }, { x: mx, y: my + K * d }, { x: mx + K * d, y: my - d });
  const mk = (a, b, c) => {
    const A = V[a], B = V[b], C = V[c];
    const dd = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
    const ux = ((A.x * A.x + A.y * A.y) * (B.y - C.y) + (B.x * B.x + B.y * B.y) * (C.y - A.y) + (C.x * C.x + C.y * C.y) * (A.y - B.y)) / dd;
    const uy = ((A.x * A.x + A.y * A.y) * (C.x - B.x) + (B.x * B.x + B.y * B.y) * (A.x - C.x) + (C.x * C.x + C.y * C.y) * (B.x - A.x)) / dd;
    return { a, b, c, cx: ux, cy: uy, r2: (A.x - ux) * (A.x - ux) + (A.y - uy) * (A.y - uy) };
  };
  let T = [mk(n, n + 1, n + 2)];
  for (let i = 0; i < n; i++) {
    const p = V[i], keep = [], edges = new Map();
    for (const t of T) {
      const dx = p.x - t.cx, dy = p.y - t.cy;
      if (dx * dx + dy * dy < t.r2 - 1e-9) {
        for (const [u, v] of [[t.a, t.b], [t.b, t.c], [t.c, t.a]]) {
          const k = u < v ? u + ',' + v : v + ',' + u;
          edges.set(k, edges.has(k) ? null : [u, v]);
        }
      } else keep.push(t);
    }
    for (const e of edges.values()) if (e) keep.push(mk(e[0], e[1], i));
    T = keep;
  }
  return T.filter(t => t.a < n && t.b < n && t.c < n).map(t => [t.a, t.b, t.c]);
}

// Delaunay on de-duplicated points (identical positions would break the circumcircles).
function buildTin(pts) {
  const seen = new Map(), idx = [], uniq = [];
  pts.forEach((p, i) => {
    const k = Math.round(p.x * 1000) + ',' + Math.round(p.y * 1000);
    if (!seen.has(k)) { seen.set(k, i); idx.push(i); uniq.push(p); }
  });
  const tris = delaunay(uniq).map(t => t.map(j => idx[j]));
  // nearest-neighbour spacing sets how long an edge may be before it is "across empty ground"
  const nn = uniq.map((p, i) => { let b = Infinity; for (let j = 0; j < uniq.length; j++) if (j !== i) b = Math.min(b, Math.hypot(p.x - uniq[j].x, p.y - uniq[j].y)); return b; }).filter(isFinite).sort((a, b) => a - b);
  const spacing = nn.length ? nn[nn.length >> 1] : 0;
  const maxEdge = Math.max(15, 2.5 * spacing);
  const good = tris.filter(([a, b, c]) => {
    const A = pts[a], B = pts[b], C = pts[c];
    const e = [Math.hypot(A.x - B.x, A.y - B.y), Math.hypot(B.x - C.x, B.y - C.y), Math.hypot(C.x - A.x, C.y - A.y)];
    // area from the cross product: Heron's formula loses all precision on slivers
    const s = (e[0] + e[1] + e[2]) / 2, area = Math.abs((B.x - A.x) * (C.y - A.y) - (C.x - A.x) * (B.y - A.y)) / 2;
    if (Math.max(...e) > maxEdge || area < 1e-6) return false;
    const circ = e[0] * e[1] * e[2] / (4 * area), inr = area / s;
    return inr / circ >= 0.04;
  });
  return { tris: good, maxEdge, spacing };
}

// Contour polylines of the TIN at `level`: [[ [x,y], ... ], ...]
function contourLines(pts, tris, level) {
  const segs = [], L = level;
  const cross = (i, j) => {
    // Canonical order, so the two triangles sharing an edge compute bit-identical points.
    const lo = Math.min(i, j), hi = Math.max(i, j), a = pts[lo], b = pts[hi], t = (L - a.z) / (b.z - a.z);
    return { k: lo + '-' + hi, x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
  };
  for (const [a, b, c] of tris) {
    const hit = [];
    for (const [i, j] of [[a, b], [b, c], [c, a]]) {
      const zi = pts[i].z - L, zj = pts[j].z - L;
      if ((zi < 0) !== (zj < 0)) hit.push(cross(i, j));
    }
    if (hit.length === 2) segs.push(hit);
  }
  const adj = new Map();
  segs.forEach((s, n) => s.forEach(p => { if (!adj.has(p.k)) adj.set(p.k, []); adj.get(p.k).push(n); }));
  const used = new Array(segs.length).fill(false), lines = [];
  const walk = (start, startPt) => {
    const line = [startPt]; let cur = start, from = startPt.k;
    while (cur !== undefined && !used[cur]) {
      used[cur] = true;
      const s = segs[cur], nextP = s[0].k === from ? s[1] : s[0];
      line.push(nextP);
      const nb = (adj.get(nextP.k) || []).find(m => !used[m]);
      from = nextP.k; cur = nb;
    }
    return line.map(p => [p.x, p.y]);
  };
  // open lines first (start at an endpoint used once), then closed loops
  segs.forEach((s, n) => { if (used[n]) return; for (const p of s) if (adj.get(p.k).length === 1) { lines.push(walk(n, p)); return; } });
  segs.forEach((s, n) => { if (!used[n]) lines.push(walk(n, s[0])); });
  return lines;
}
// ---- backends: the same interface over the pure-JS reference above and over the Zig/WebAssembly core ----
// load(ll, n): ll is a Float64Array of n rows [lon, lat, elevation]. Returns
//   { n, pts: Float64Array(3n) local x,y,z, tris: Uint32Array(3m), lat0, lon0, spacing, maxEdge, bbox, zmin, zmax }
// contours([[z, major], ...]) -> [{ z, major, xy: Float64Array }]; tint2d(zmin, zmax) -> Uint32Array 0xRRGGBB per triangle;
// prep3d(view) -> { scr, ord, col } (screen x,y,depth per point; triangles back to front with shaded colours);
// nearest(sx, sy, cx, cy, sc, w, h, maxd) -> index or -1.
const RAMP = ['#2e7d4f', '#9bc17a', '#e8dba0', '#c9a26b', '#8c5a3c'];
function tintRgb(t) {
  const hx = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  t = Math.min(1, Math.max(0, t)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i, a = hx(RAMP[i]), b = hx(RAMP[i + 1]);
  return a.map((v, k) => Math.round(v + (b[k] - v) * f));
}
const packRgb = c => (Math.min(255, c[0]) << 16) | (Math.min(255, c[1]) << 8) | Math.min(255, c[2]);

const jsGeo = {
  name: 'js',
  load(ll, n) {
    const feats = [];
    for (let i = 0; i < n; i++) feats.push({ geometry: { type: 'Point', coordinates: [ll[3 * i], ll[3 * i + 1], ll[3 * i + 2]] } });
    const r = llToLocal(feats), tin = buildTin(r.pts);
    this.P = r.pts; this.T = tin.tris;
    const pts = new Float64Array(3 * n), tris = new Uint32Array(3 * tin.tris.length);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    r.pts.forEach((p, i) => {
      pts[3 * i] = p.x; pts[3 * i + 1] = p.y; pts[3 * i + 2] = p.z;
      x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z);
    });
    tin.tris.forEach((t, k) => { tris[3 * k] = t[0]; tris[3 * k + 1] = t[1]; tris[3 * k + 2] = t[2]; });
    this.pts = pts; this.tris = tris;
    return { n, pts, tris, lat0: r.lat0, lon0: r.lon0, spacing: tin.spacing, maxEdge: tin.maxEdge, bbox: [x0, x1, y0, y1], zmin: z0, zmax: z1 };
  },
  contours(levels) {
    const out = [];
    for (const [z, major] of levels) for (const line of contourLines(this.P, this.T, z)) {
      const xy = new Float64Array(2 * line.length);
      line.forEach((q, i) => { xy[2 * i] = q[0]; xy[2 * i + 1] = q[1]; });
      out.push({ z, major, xy });
    }
    return out;
  },
  tint2d(zmin, zmax) {
    const P = this.P, span = Math.max(zmax - zmin, 1e-9);
    return Uint32Array.from(this.T, ([a, b, c]) => packRgb(tintRgb(((P[a].z + P[b].z + P[c].z) / 3 - zmin) / span)));
  },
  prep3d(v) {
    const P = this.P, T = this.T, cyaw = Math.cos(v.yaw), syaw = Math.sin(v.yaw), cp = Math.cos(v.pitch), sp = Math.sin(v.pitch), zm = (v.zmin + v.zmax) / 2;
    const scr = new Float64Array(3 * P.length);
    P.forEach((p, i) => {
      const X = p.x - v.cx, Y = p.y - v.cy, Z = (p.z - zm) * v.ex, x1 = X * cyaw - Y * syaw, y1 = X * syaw + Y * cyaw;
      scr[3 * i] = v.w / 2 + x1 * v.sc; scr[3 * i + 1] = v.h / 2 - (y1 * sp + Z * cp) * v.sc; scr[3 * i + 2] = y1 * cp - Z * sp;
    });
    const L = [0.35, 0.55, 0.75], ln = Math.hypot(...L), l = L.map(q => q / ln), span = Math.max(v.zmax - v.zmin, 1e-9);
    const items = T.map(([a, b, c], t) => {
      const u = [P[b].x - P[a].x, P[b].y - P[a].y, (P[b].z - P[a].z) * v.ex], w = [P[c].x - P[a].x, P[c].y - P[a].y, (P[c].z - P[a].z) * v.ex];
      let n = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
      if (n[2] < 0) n = n.map(q => -q);
      const nl = Math.hypot(...n) || 1, lam = Math.max(0.25, (n[0] * l[0] + n[1] * l[1] + n[2] * l[2]) / nl);
      return { t, depth: (scr[3 * a + 2] + scr[3 * b + 2] + scr[3 * c + 2]) / 3, lam, tt: ((P[a].z + P[b].z + P[c].z) / 3 - v.zmin) / span };
    }).sort((p, q) => p.depth - q.depth);
    const ord = Uint32Array.from(items, it => it.t);
    const col = Uint32Array.from(items, it => packRgb(tintRgb(it.tt).map(q => Math.round(q * (0.45 + 0.75 * it.lam)))));
    return { scr, ord, col };
  },
  nearest(sx, sy, cx, cy, sc, w, h, maxd) {
    let best = -1, bd = maxd;
    this.P.forEach((p, i) => { const d = Math.hypot(w / 2 + (p.x - cx) * sc - sx, h / 2 - (p.y - cy) * sc - sy); if (d < bd) { bd = d; best = i; } });
    return best;
  },
};

// The WebAssembly core (src/geom, built to src/map.wasm). `inst` is an instantiated module.
function makeWasmGeo(inst) {
  const X = inst.exports, cap = X.max_points();
  const f64 = (p, n) => new Float64Array(X.memory.buffer, p, n), u32 = (p, n) => new Uint32Array(X.memory.buffer, p, n);
  let nPts = 0, nTri = 0;
  return {
    name: 'wasm', cap,
    load(ll, n) {
      if (n > cap) { const e = new Error('too many points: ' + n + ' (the viewer handles up to ' + cap + ')'); e.tooMany = true; throw e; }
      f64(X.in_ptr(), 3 * n).set(ll.subarray(0, 3 * n));
      const m = X.load(n);
      if (m < 0) throw new Error('geometry core status ' + m);
      nPts = n; nTri = m;
      const I = f64(X.info_ptr(), X.info_len());
      return { n, pts: f64(X.pts_ptr(), 3 * n).slice(), tris: u32(X.tris_ptr(), 3 * m).slice(), lat0: I[0], lon0: I[1], spacing: I[8], maxEdge: I[9],
               bbox: [I[2], I[3], I[4], I[5]], zmin: I[6], zmax: I[7] };
    },
    contours(levels) {
      X.contour_reset();
      let overflow = false;
      for (const [z, major] of levels) if (X.contour_level(z, major ? 1 : 0) < 0) { overflow = true; break; }
      const nl = X.line_count(), st = u32(X.line_start_ptr(), nl), ln = u32(X.line_len_ptr(), nl), zz = f64(X.line_z_ptr(), nl), mj = u32(X.line_major_ptr(), nl);
      const xy = f64(X.line_xy_ptr(), 2 * X.line_point_count()), out = [];
      for (let i = 0; i < nl; i++) out.push({ z: zz[i], major: mj[i] === 1, xy: xy.slice(2 * st[i], 2 * (st[i] + ln[i])) });
      out.overflow = overflow;
      return out;
    },
    tint2d(zmin, zmax) { return u32(X.tint2d(zmin, zmax), nTri).slice(); },
    prep3d(v) {
      X.prep3d(v.cx, v.cy, v.sc, v.yaw, v.pitch, v.ex, v.zmin, v.zmax, v.w, v.h);
      return { scr: f64(X.scr_ptr(), 3 * nPts), ord: u32(X.ord3_ptr(), nTri), col: u32(X.col3_ptr(), nTri) };  // views: valid until the next call
    },
    nearest(sx, sy, cx, cy, sc, w, h, maxd) { return X.nearest(sx, sy, cx, cy, sc, w, h, maxd); },
  };
}
async function loadWasmGeo(b64, url) {
  let bytes;
  if (b64) { const s = atob(b64); bytes = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i); }
  else { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); bytes = await r.arrayBuffer(); }
  const { instance } = await WebAssembly.instantiate(bytes, {});
  return makeWasmGeo(instance);
}
// ==== end geometry ====

// ---------------------------------------------------------------- UI
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let S = { pts: [], tris: new Uint32Array(0), mode: '2d', zmin: 0, zmax: 1, interval: 1, cx: 0, cy: 0, sc: 1, yaw: 0.6, pitch: 0.9, ex: 2, hover: -1, lat0: 0, lon0: 0, title: 'RTK map', contours: [], geo: jsGeo, tintCss: [], tinMs: 0, info: null };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgbCss = c => 'rgb(' + (c >> 16) + ',' + ((c >> 8) & 255) + ',' + (c & 255) + ')';

function load(gj) {
  const feats = ((gj && gj.features) || []).filter(x => x.geometry && x.geometry.type === 'Point' && Array.isArray(x.geometry.coordinates) &&
    x.geometry.coordinates.length >= 3 && x.geometry.coordinates.slice(0, 3).every(Number.isFinite));
  const ll = new Float64Array(3 * feats.length);
  feats.forEach((f, i) => { ll[3 * i] = f.geometry.coordinates[0]; ll[3 * i + 1] = f.geometry.coordinates[1]; ll[3 * i + 2] = f.geometry.coordinates[2]; });
  const t0 = performance.now();
  let r;
  try { r = S.geo.load(ll, feats.length); }
  catch (e) {
    if (e && e.tooMany) { S.pts = []; S.tris = new Uint32Array(0); S.contours = []; msg(e.message); stats(); draw(); return; }
    console.warn('wasm geometry failed, using the JavaScript fallback:', e);
    S.geo = jsGeo; r = S.geo.load(ll, feats.length);
  }
  S.tinMs = performance.now() - t0;
  S.pts = feats.map((f, i) => {
    const pr = f.properties || {};
    return { x: r.pts[3 * i], y: r.pts[3 * i + 1], z: r.pts[3 * i + 2], id: String(pr.id || ''), code: pr.code || '', hacc: pr.h_acc, vacc: pr.v_acc, fix: pr.fix || '', time: pr.time || '' };
  });
  S.lat0 = r.lat0; S.lon0 = r.lon0; S.tris = r.tris; S.info = r; S.zmin = r.zmin; S.zmax = r.zmax;
  if (!isFinite(S.zmin)) { S.zmin = 0; S.zmax = 1; }
  if (S.pts.length < 3) msg('Need at least 3 points to draw a surface (have ' + S.pts.length + ').');
  else if (!S.tris.length) msg('The points are collinear or too far apart to form a surface.');
  else msg('');
  S.tintCss = S.tris.length ? Array.from(S.geo.tint2d(S.zmin, S.zmax), rgbCss) : [];
  recontour(); fit(); stats();
}
function msg(t) { const m = $('msg'); m.style.display = t ? 'flex' : 'none'; m.textContent = t; }

function recontour() {
  const sel = parseFloat($('sInt').value);
  S.interval = sel > 0 ? sel : niceStep(Math.max((S.zmax - S.zmin) / 12, 0.05));
  S.contours = [];
  if (!S.tris.length) return;
  const start = Math.ceil(S.zmin / S.interval - 1e-9) * S.interval, levels = [];
  for (let z = start; z <= S.zmax + 1e-9; z += S.interval) {
    const zz = Math.round(z / S.interval) * S.interval;
    levels.push([zz, Math.abs(zz / (S.interval * 5) - Math.round(zz / (S.interval * 5))) < 1e-6]);
  }
  S.contours = S.geo.contours(levels);
  if (S.contours.overflow) msg('Too many contour lines to draw; choose a larger interval.');
}

function stats() {
  const p = S.pts; if (!p.length || !S.info) { $('stats').textContent = ''; return; }
  const acc = p.map(q => q.hacc).filter(v => v != null).sort((a, b) => a - b), b = S.info.bbox;
  $('stats').textContent = p.length + ' points · ' + (b[1] - b[0]).toFixed(0) + ' × ' + (b[3] - b[2]).toFixed(0) + ' m · relief ' +
    (S.zmax - S.zmin).toFixed(2) + ' m · contour ' + S.interval + ' m' + (acc.length ? ' · median H ±' + (acc[acc.length >> 1] * 100).toFixed(1) + ' cm' : '') +
    (S.tris.length ? ' · ' + (S.tris.length / 3) + ' triangles' : '') + ' · TIN ' + S.tinMs.toFixed(S.tinMs < 10 ? 1 : 0) + ' ms (' + S.geo.name + ')';
  $('lmax').textContent = S.zmax.toFixed(2) + ' m'; $('lmin').textContent = S.zmin.toFixed(2) + ' m';
  $('bar').style.background = 'linear-gradient(to right,' + RAMP.join(',') + ')';
}

function size() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  return [r.width, r.height];
}
function fit() {
  if (!S.pts.length) return;
  const [w, h] = size(), b = S.info.bbox;
  S.cx = (b[0] + b[1]) / 2; S.cy = (b[2] + b[3]) / 2;
  S.sc = 0.82 * Math.min(w / Math.max(b[1] - b[0], 1), h / Math.max(b[3] - b[2], 1));
  draw();
}

// plan: world (x east, y north) -> screen
function P2(x, y, w, h) { return [w / 2 + (x - S.cx) * S.sc, h / 2 - (y - S.cy) * S.sc]; }
// 3D: orthographic, z scaled by exaggeration (points and triangles are projected by the geometry core; this is for contours)
function P3(x, y, z, w, h) {
  const X = x - S.cx, Y = y - S.cy, Z = (z - (S.zmin + S.zmax) / 2) * S.ex;
  const cyaw = Math.cos(S.yaw), syaw = Math.sin(S.yaw), cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
  const x1 = X * cyaw - Y * syaw, y1 = X * syaw + Y * cyaw;
  return [w / 2 + x1 * S.sc, h / 2 - (y1 * sp + Z * cp) * S.sc, y1 * cp - Z * sp];
}

function draw() {
  const [w, h] = size();
  ctx.clearRect(0, 0, w, h);
  if (S.pts.length < 3 || !S.tris.length) { drawPoints2D(w, h); return; }
  if (S.mode === '2d') draw2D(w, h); else draw3D(w, h);
}

function draw2D(w, h) {
  const pts = S.pts, T = S.tris, nT = T.length / 3;
  if ($('cTint').checked) {
    ctx.globalAlpha = 0.55;
    for (let t = 0; t < nT; t++) {
      const a = pts[T[3 * t]], b = pts[T[3 * t + 1]], c = pts[T[3 * t + 2]];
      ctx.fillStyle = S.tintCss[t];
      ctx.beginPath(); ctx.moveTo(w / 2 + (a.x - S.cx) * S.sc, h / 2 - (a.y - S.cy) * S.sc);
      ctx.lineTo(w / 2 + (b.x - S.cx) * S.sc, h / 2 - (b.y - S.cy) * S.sc); ctx.lineTo(w / 2 + (c.x - S.cx) * S.sc, h / 2 - (c.y - S.cy) * S.sc);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  if ($('cTin').checked) {
    ctx.strokeStyle = css('--tin'); ctx.lineWidth = 0.6; ctx.beginPath();
    for (let t = 0; t < nT; t++) {
      const A = P2(pts[T[3 * t]].x, pts[T[3 * t]].y, w, h), B = P2(pts[T[3 * t + 1]].x, pts[T[3 * t + 1]].y, w, h), C = P2(pts[T[3 * t + 2]].x, pts[T[3 * t + 2]].y, w, h);
      ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineTo(C[0], C[1]); ctx.closePath();
    }
    ctx.stroke();
  }
  if ($('cCont').checked) {
    for (const major of [false, true]) {
      ctx.strokeStyle = css(major ? '--major' : '--minor'); ctx.lineWidth = major ? 1.6 : 0.8; ctx.beginPath();
      for (const c of S.contours) if (c.major === major) for (let i = 0; i < c.xy.length; i += 2) {
        const s = P2(c.xy[i], c.xy[i + 1], w, h); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]);
      }
      ctx.stroke();
    }
    ctx.fillStyle = css('--major'); ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const c of S.contours) if (c.major && c.xy.length > 8) {
      const k = (c.xy.length >> 2) * 2, s = P2(c.xy[k], c.xy[k + 1], w, h);
      ctx.fillStyle = css('--card'); ctx.fillRect(s[0] - 14, s[1] - 7, 28, 14); ctx.fillStyle = css('--major'); ctx.fillText(c.z.toFixed(c.z % 1 ? 1 : 0), s[0], s[1]);
    }
  }
  drawPoints2D(w, h);
  furniture(w, h);
}

function drawPoints2D(w, h) {
  if (!$('cPts').checked && S.tris.length) return;
  ctx.font = '10px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const placed = [];  // label rectangles already drawn; later labels that would overlap are skipped
  S.pts.forEach((p, i) => {
    const s = P2(p.x, p.y, w, h), fixed = p.fix === 'RTK_FIXED';
    ctx.beginPath(); ctx.arc(s[0], s[1], i === S.hover ? 5 : 3, 0, 7);
    if (fixed) { ctx.fillStyle = css('--pt'); ctx.fill(); } else { ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1.5; ctx.stroke(); }
    if ($('cLab').checked && S.sc > 0.4) {
      const txt = p.id.replace(/^0+/, '') + ' ' + p.z.toFixed(2) + (p.code && p.code !== 'PT' ? ' ' + p.code : '');
      const r = { x: s[0] + 5, y: s[1] - 13, w: ctx.measureText(txt).width, h: 12 };
      if (i === S.hover || !placed.some(q => r.x < q.x + q.w && q.x < r.x + r.w && r.y < q.y + q.h && q.y < r.y + r.h)) {
        placed.push(r); ctx.fillStyle = css('--ink'); ctx.fillText(txt, r.x, s[1] - 4);
      }
    }
  });
}

function furniture(w, h) {
  // north arrow (plan view is always north-up)
  ctx.strokeStyle = css('--ink'); ctx.fillStyle = css('--ink'); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(w - 30, 70); ctx.lineTo(w - 30, 32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w - 30, 28); ctx.lineTo(w - 35, 40); ctx.lineTo(w - 25, 40); ctx.closePath(); ctx.fill();
  ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('N', w - 30, 82);
  // scale bar
  const m = niceStep(90 / S.sc), px = m * S.sc;
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(12, h - 60); ctx.lineTo(12 + px, h - 60); ctx.stroke();
  ctx.font = '11px system-ui'; ctx.textAlign = 'left'; ctx.fillText(m + ' m', 12, h - 66);
}

function draw3D(w, h) {
  const T = S.tris, v = S.geo.prep3d({ cx: S.cx, cy: S.cy, sc: S.sc, yaw: S.yaw, pitch: S.pitch, ex: S.ex, zmin: S.zmin, zmax: S.zmax, w, h });
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 0.5;
  for (let k = 0; k < v.ord.length; k++) {
    const t = v.ord[k], a = 3 * T[3 * t], b = 3 * T[3 * t + 1], c = 3 * T[3 * t + 2];
    ctx.fillStyle = rgbCss(v.col[k]);
    ctx.beginPath(); ctx.moveTo(v.scr[a], v.scr[a + 1]); ctx.lineTo(v.scr[b], v.scr[b + 1]); ctx.lineTo(v.scr[c], v.scr[c + 1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if ($('cCont').checked) {
    ctx.lineWidth = 1;
    for (const c of S.contours) {
      ctx.strokeStyle = c.major ? css('--major') : 'rgba(80,50,20,0.5)'; ctx.beginPath();
      for (let i = 0; i < c.xy.length; i += 2) { const s = P3(c.xy[i], c.xy[i + 1], c.z, w, h); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }
      ctx.stroke();
    }
  }
  if ($('cPts').checked) { ctx.fillStyle = css('--pt'); for (let i = 0; i < S.pts.length; i++) { ctx.beginPath(); ctx.arc(v.scr[3 * i], v.scr[3 * i + 1], 2.5, 0, 7); ctx.fill(); } }
  ctx.fillStyle = css('--dim'); ctx.font = '11px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('drag to rotate · wheel to zoom · vertical exaggeration x' + S.ex, 12, h - 66);
}

// ---------------------------------------------------------------- interaction
function setMode(m) { S.mode = m; $('b2d').classList.toggle('on', m === '2d'); $('b3d').classList.toggle('on', m === '3d'); $('exl').style.display = m === '3d' ? '' : 'none'; draw(); }
$('b2d').onclick = () => setMode('2d'); $('b3d').onclick = () => setMode('3d');
for (const id of ['cTint', 'cCont', 'cTin', 'cPts', 'cLab']) $(id).onchange = draw;
$('sInt').onchange = () => { recontour(); stats(); draw(); };
$('rEx').oninput = e => { S.ex = parseFloat(e.target.value); draw(); };
$('bFit').onclick = fit;
$('bPng').onclick = () => { const a = document.createElement('a'); a.download = (S.title || 'map').replace(/\W+/g, '-') + '.png'; a.href = cv.toDataURL('image/png'); a.click(); };
window.onresize = draw;

let drag = null, pinch = null;
cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY }; cv.style.cursor = 'grabbing'; };
cv.onpointerup = () => { drag = null; cv.style.cursor = 'grab'; };
cv.onpointermove = e => {
  const r = cv.getBoundingClientRect();
  if (drag && !pinch) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY };
    if (S.mode === '2d') { S.cx -= dx / S.sc; S.cy += dy / S.sc; }
    else { S.yaw += dx * 0.008; S.pitch = Math.min(1.5, Math.max(0.1, S.pitch + dy * 0.006)); }
    draw();
  } else if (S.mode === '2d') hover(e.clientX - r.left, e.clientY - r.top, r);
};
cv.onwheel = e => { e.preventDefault(); S.sc *= Math.exp(-e.deltaY * 0.0015); draw(); };
function hover(mx, my, r) {
  const best = S.pts.length ? S.geo.nearest(mx, my, S.cx, S.cy, S.sc, r.width, r.height, 12) : -1;
  const tip = $('tip');
  if (best !== S.hover) { S.hover = best; draw(); }
  if (best < 0) { tip.style.display = 'none'; return; }
  const p = S.pts[best];
  tip.textContent = 'Point ' + p.id + (p.code ? '  ·  ' + p.code : '') + '\n' + p.z.toFixed(3) + ' m  ·  ' + p.fix + '\n±' + (p.hacc != null ? (p.hacc * 100).toFixed(1) + ' cm H / ' + (p.vacc * 100).toFixed(1) + ' cm V' : 'n/a') + '\n' + p.time;
  tip.style.display = 'block'; tip.style.left = Math.min(mx + 14, r.width - 190) + 'px'; tip.style.top = Math.max(my - 10, 4) + 'px';
}
cv.ontouchstart = e => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); };
cv.ontouchmove = e => { if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); S.sc *= d / pinch; pinch = d; draw(); } };
cv.ontouchend = () => { pinch = null; };

// ---------------------------------------------------------------- start
function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('3d')) setMode('3d');
  if (h.has('yaw')) S.yaw = parseFloat(h.get('yaw'));
  if (h.has('pitch')) S.pitch = parseFloat(h.get('pitch'));
  if (h.has('ex')) { S.ex = parseFloat(h.get('ex')); $('rEx').value = S.ex; }
  if (h.has('notin')) $('cTint').checked = false;
}
async function start() {
  const q = new URLSearchParams(location.search), job = q.get('job');
  let gj = window.RTK_DATA;
  S.title = job || (gj && gj.title) || 'current job';
  $('title').textContent = (gj && gj.title) || ('RTK map · ' + S.title);
  document.title = $('title').textContent;
  // WebAssembly geometry core when available (embedded in exported files, /map.wasm on the unit);
  // the pure-JavaScript implementation above is the automatic fallback (also forced by ?nowasm).
  const wasmP = (q.has('nowasm') || typeof WebAssembly !== 'object') ? Promise.resolve(null)
    : loadWasmGeo(window.RTK_WASM, '/map.wasm').catch(e => { console.warn('WebAssembly core unavailable, using JavaScript:', e); return null; });
  if (!gj) {
    try {
      const r = await fetch(job ? '/jobs/' + encodeURIComponent(job) + '.geojson' : '/points.geojson', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? 'no job file named ' + (job || 'current') + ' on this unit' : 'HTTP ' + r.status);
      gj = await r.json();
    } catch (e) { msg('Could not load points: ' + (e && e.message ? e.message : e)); return; }
  }
  S.geo = (await wasmP) || jsGeo;
  applyHash(); load(gj);
}
if (typeof document !== 'undefined' && document.getElementById('cv')) start();
</script>
</body>
</html>
