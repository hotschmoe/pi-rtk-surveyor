<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTK map viewer</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14181f;--dim:#5b6573;--line:#d9dde3;--accent:#1f5fbf;--minor:#b98a5a;--major:#8a4b12;--tin:#c4c8ce;--pt:#111}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e8ebf0;--dim:#97a1af;--line:#2a323d;--accent:#7fb0ff;--minor:#b98a5a;--major:#e0a468;--tin:#3a424d;--pt:#f2f2f2}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
label{display:inline-flex;align-items:center;gap:4px;color:var(--dim)}
#wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;display:none;white-space:pre;box-shadow:0 2px 8px #0003}
#stats{position:absolute;left:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--dim);max-width:70%}
#msg{pointer-events:none;position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--dim);padding:20px}
#legend{position:absolute;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--dim)}
#bar{height:10px;width:140px;border-radius:3px;margin:2px 0}
</style>
</head>
<body>
<header>
  <h1 id="title">RTK map</h1>
  <button id="b2d" class="on">Plan</button><button id="b3d">3D</button>
  <label><input type="checkbox" id="cTint" checked> tint</label>
  <label><input type="checkbox" id="cCont" checked> contours</label>
  <label><input type="checkbox" id="cTin"> TIN</label>
  <label><input type="checkbox" id="cPts" checked> points</label>
  <label><input type="checkbox" id="cLab" checked> labels</label>
  <label>interval <select id="sInt"><option value="0">auto</option><option>0.1</option><option>0.25</option><option>0.5</option><option>1</option><option>2</option><option>5</option></select></label>
  <label id="exl" style="display:none">vertical x<input type="range" id="rEx" min="1" max="10" step="0.5" value="2"></label>
  <button id="bFit">Fit</button><button id="bPng">Save PNG</button>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="tip"></div><div id="msg"></div>
  <div id="stats"></div>
  <div id="legend"><div id="lmax"></div><div id="bar"></div><div id="lmin"></div></div>
</div>

<script>
// ==== geometry (testable; extracted by tools/test_viewer.js) ====
function llToLocal(features) {
  const f = features.filter(x => x.geometry && x.geometry.type === 'Point');
  if (!f.length) return { pts: [], lat0: 0, lon0: 0 };
  let lat0 = 0, lon0 = 0;
  for (const x of f) { lon0 += x.geometry.coordinates[0]; lat0 += x.geometry.coordinates[1]; }
  lat0 /= f.length; lon0 /= f.length;
  const p = lat0 * Math.PI / 180;
  const mLat = 111132.92 - 559.82 * Math.cos(2 * p) + 1.175 * Math.cos(4 * p);
  const mLon = 111412.84 * Math.cos(p) - 93.5 * Math.cos(3 * p);
  const pts = f.map(x => {
    const c = x.geometry.coordinates, pr = x.properties || {};
    return { x: (c[0] - lon0) * mLon, y: (c[1] - lat0) * mLat, z: c[2], id: String(pr.id || ''), code: pr.code || '',
             hacc: pr.h_acc, vacc: pr.v_acc, fix: pr.fix || '', time: pr.time || '' };
  });
  return { pts, lat0, lon0 };
}

function niceStep(x) {
  const e = Math.pow(10, Math.floor(Math.log10(x)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= x) return m * e;
  return 10 * e;
}

// Bowyer-Watson Delaunay triangulation of {x,y} points. Returns [[i,j,k], ...] (indices into P).
function delaunay(P) {
  const n = P.length;
  if (n < 3) return [];
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (const p of P) { minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y); }
  const d = Math.max(maxx - minx, maxy - miny, 1), mx = (minx + maxx) / 2, my = (miny + maxy) / 2;
  const V = P.map(p => ({ x: p.x, y: p.y }));
  // A very large super-triangle: a small one swallows near-collinear hull triangles (huge circumcircles).
  const K = 1000;
  V.push({ x: mx - K * d, y: my - d }, { x: mx, y: my + K * d }, { x: mx + K * d, y: my - d });
  const mk = (a, b, c) => {
    const A = V[a], B = V[b], C = V[c];
    const dd = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
    const ux = ((A.x * A.x + A.y * A.y) * (B.y - C.y) + (B.x * B.x + B.y * B.y) * (C.y - A.y) + (C.x * C.x + C.y * C.y) * (A.y - B.y)) / dd;
    const uy = ((A.x * A.x + A.y * A.y) * (C.x - B.x) + (B.x * B.x + B.y * B.y) * (A.x - C.x) + (C.x * C.x + C.y * C.y) * (B.x - A.x)) / dd;
    return { a, b, c, cx: ux, cy: uy, r2: (A.x - ux) * (A.x - ux) + (A.y - uy) * (A.y - uy) };
  };
  let T = [mk(n, n + 1, n + 2)];
  for (let i = 0; i < n; i++) {
    const p = V[i], keep = [], edges = new Map();
    for (const t of T) {
      const dx = p.x - t.cx, dy = p.y - t.cy;
      if (dx * dx + dy * dy < t.r2 - 1e-9) {
        for (const [u, v] of [[t.a, t.b], [t.b, t.c], [t.c, t.a]]) {
          const k = u < v ? u + ',' + v : v + ',' + u;
          edges.set(k, edges.has(k) ? null : [u, v]);
        }
      } else keep.push(t);
    }
    for (const e of edges.values()) if (e) keep.push(mk(e[0], e[1], i));
    T = keep;
  }
  return T.filter(t => t.a < n && t.b < n && t.c < n).map(t => [t.a, t.b, t.c]);
}

// Delaunay on de-duplicated points (identical positions would break the circumcircles).
function buildTin(pts) {
  const seen = new Map(), idx = [], uniq = [];
  pts.forEach((p, i) => {
    const k = Math.round(p.x * 1000) + ',' + Math.round(p.y * 1000);
    if (!seen.has(k)) { seen.set(k, i); idx.push(i); uniq.push(p); }
  });
  const tris = delaunay(uniq).map(t => t.map(j => idx[j]));
  // nearest-neighbour spacing sets how long an edge may be before it is "across empty ground"
  const nn = uniq.map((p, i) => { let b = Infinity; for (let j = 0; j < uniq.length; j++) if (j !== i) b = Math.min(b, Math.hypot(p.x - uniq[j].x, p.y - uniq[j].y)); return b; }).filter(isFinite).sort((a, b) => a - b);
  const spacing = nn.length ? nn[nn.length >> 1] : 0;
  const maxEdge = Math.max(15, 2.5 * spacing);

  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 0.5;
  for (let k = 0; k < v.ord.length; k++) {
    const t = v.ord[k], a = 3 * T[3 * t], b = 3 * T[3 * t + 1], c = 3 * T[3 * t + 2];
    ctx.fillStyle = rgbCss(v.col[k]);
    ctx.beginPath(); ctx.moveTo(v.scr[a], v.scr[a + 1]); ctx.lineTo(v.scr[b], v.scr[b + 1]); ctx.lineTo(v.scr[c], v.scr[c + 1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if ($('cCont').checked) {
    ctx.lineWidth = 1;
    for (const c of S.contours) {
      ctx.strokeStyle = c.major ? css('--major') : 'rgba(80,50,20,0.5)'; ctx.beginPath();
      for (let i = 0; i < c.xy.length; i += 2) { const s = P3(c.xy[i], c.xy[i + 1], c.z, w, h); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }
      ctx.stroke();
    }
  }
  if ($('cPts').checked) { ctx.fillStyle = css('--pt'); for (let i = 0; i < S.pts.length; i++) { ctx.beginPath(); ctx.arc(v.scr[3 * i], v.scr[3 * i + 1], 2.5, 0, 7); ctx.fill(); } }
  ctx.fillStyle = css('--dim'); ctx.font = '11px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('drag to rotate · wheel to zoom · vertical exaggeration x' + S.ex, 12, h - 66);
}

// ---------------------------------------------------------------- interaction
function setMode(m) { S.mode = m; $('b2d').classList.toggle('on', m === '2d'); $('b3d').classList.toggle('on', m === '3d'); $('exl').style.display = m === '3d' ? '' : 'none'; draw(); }
$('b2d').onclick = () => setMode('2d'); $('b3d').onclick = () => setMode('3d');
for (const id of ['cTint', 'cCont', 'cTin', 'cPts', 'cLab']) $(id).onchange = draw;
$('sInt').onchange = () => { recontour(); stats(); draw(); };
$('rEx').oninput = e => { S.ex = parseFloat(e.target.value); draw(); };
$('bFit').onclick = fit;
$('bPng').onclick = () => { const a = document.createElement('a'); a.download = (S.title || 'map').replace(/\W+/g, '-') + '.png'; a.href = cv.toDataURL('image/png'); a.click(); };
window.onresize = draw;

let drag = null, pinch = null;
cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY }; cv.style.cursor = 'grabbing'; };
cv.onpointerup = () => { drag = null; cv.style.cursor = 'grab'; };
cv.onpointermove = e => {
  const r = cv.getBoundingClientRect();
  if (drag && !pinch) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY };
    if (S.mode === '2d') { S.cx -= dx / S.sc; S.cy += dy / S.sc; }
    else { S.yaw += dx * 0.008; S.pitch = Math.min(1.5, Math.max(0.1, S.pitch + dy * 0.006)); }
    draw();
  } else if (S.mode === '2d') hover(e.clientX - r.left, e.clientY - r.top, r);
};
cv.onwheel = e => { e.preventDefault(); S.sc *= Math.exp(-e.deltaY * 0.0015); draw(); };
function hover(mx, my, r) {
  const best = S.pts.length ? S.geo.nearest(mx, my, S.cx, S.cy, S.sc, r.width, r.height, 12) : -1;
  const tip = $('tip');
  if (best !== S.hover) { S.hover = best; draw(); }
  if (best < 0) { tip.style.display = 'none'; return; }
  const p = S.pts[best];
  tip.textContent = 'Point ' + p.id + (p.code ? '  ·  ' + p.code : '') + '\n' + p.z.toFixed(3) + ' m  ·  ' + p.fix + '\n±' + (p.hacc != null ? (p.hacc * 100).toFixed(1) + ' cm H / ' + (p.vacc * 100).toFixed(1) + ' cm V' : 'n/a') + '\n' + p.time;
  tip.style.display = 'block'; tip.style.left = Math.min(mx + 14, r.width - 190) + 'px'; tip.style.top = Math.max(my - 10, 4) + 'px';
}
cv.ontouchstart = e => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); };
cv.ontouchmove = e => { if (e.touches.length === 2 && pinch) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); S.sc *= d / pinch; pinch = d; draw(); } };
cv.ontouchend = () => { pinch = null; };

// ---------------------------------------------------------------- start
function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('3d')) setMode('3d');
  if (h.has('yaw')) S.yaw = parseFloat(h.get('yaw'));
  if (h.has('pitch')) S.pitch = parseFloat(h.get('pitch'));
  if (h.has('ex')) { S.ex = parseFloat(h.get('ex')); $('rEx').value = S.ex; }
  if (h.has('notin')) $('cTint').checked = false;
}
async function start() {
  const q = new URLSearchParams(location.search), job = q.get('job');
  let gj = window.RTK_DATA;
  S.title = job || (gj && gj.title) || 'current job';
  $('title').textContent = (gj && gj.title) || ('RTK map · ' + S.title);
  document.title = $('title').textContent;
  // WebAssembly geometry core when available (embedded in exported files, /map.wasm on the unit);
  // the pure-JavaScript implementation above is the automatic fallback (also forced by ?nowasm).
  const wasmP = (q.has('nowasm') || typeof WebAssembly !== 'object') ? Promise.resolve(null)
    : loadWasmGeo(window.RTK_WASM, '/map.wasm').catch(e => { console.warn('WebAssembly core unavailable, using JavaScript:', e); return null; });
  if (!gj) {
    try {
      const r = await fetch(job ? '/jobs/' + encodeURIComponent(job) + '.geojson' : '/points.geojson', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? 'no job file named ' + (job || 'current') + ' on this unit' : 'HTTP ' + r.status);
      gj = await r.json();
    } catch (e) { msg('Could not load points: ' + (e && e.message ? e.message : e)); return; }
  }
  S.geo = (await wasmP) || jsGeo;
  applyHash(); load(gj);
}
if (typeof document !== 'undefined' && document.getElementById('cv')) start();
</script>
</body>
